deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - internal
  script:
    - kubectl config use-context on-premise-gpu-k8s-cluster/gitlab-agent-for-kubernetes:gpu-microk8s
    - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -
  environment:
    name: gpu
